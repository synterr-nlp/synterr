# ERRANT Error Classification Schema (Russian)
# Based on: RuERRANT - ERRANT fork for Russian
# https://github.com/Askinkaty/errant
#
# Format: {OP}:{CAT}:{SUBCAT}
#   OP: M (Missing), U (Unnecessary), R (Replacement)
#   CAT: POS tag or error category
#   SUBCAT: Inflectional feature (optional)

name: errant
version: "1.0"
description: "ERRANT error taxonomy for Russian GEC evaluation"

detection_categories:
  SPELL: "Spelling errors"
  MORPH: "Morphological errors"
  OTHER: "Other errors"

# ============================================================================
# PRIMARY TAGS (ERRANT categories)
# ============================================================================

primary_tags:
  # ---------------------------------------------------------------------------
  # SPELLING / ORTHOGRAPHY
  # ---------------------------------------------------------------------------
  SPELL:
    description: "Spelling error"
    detection_category: SPELL

  ORTH:
    description: "Orthography (whitespace/case)"
    detection_category: SPELL

  # ---------------------------------------------------------------------------
  # NOUN INFLECTION
  # ---------------------------------------------------------------------------
  NOUN:
    description: "Noun error (general)"
    detection_category: MORPH

  NOUN:CASE:
    description: "Noun case error"
    detection_category: MORPH

  NOUN:NUM:
    description: "Noun number error"
    detection_category: MORPH

  NOUN:INFL:
    description: "Noun inflection (other)"
    detection_category: MORPH

  # ---------------------------------------------------------------------------
  # ADJECTIVE INFLECTION
  # ---------------------------------------------------------------------------
  ADJ:
    description: "Adjective error (general)"
    detection_category: MORPH

  ADJ:CASE:
    description: "Adjective case error"
    detection_category: MORPH

  ADJ:NUM:
    description: "Adjective number error"
    detection_category: MORPH

  ADJ:GEN:
    description: "Adjective gender error"
    detection_category: MORPH

  ADJ:INFL:
    description: "Adjective inflection (other)"
    detection_category: MORPH

  ADJ:COMP_FORM:
    description: "Comparative form error"
    detection_category: MORPH

  ADJ:FULL/SHORT:
    description: "Full/short form error"
    detection_category: MORPH

  # ---------------------------------------------------------------------------
  # VERB INFLECTION
  # ---------------------------------------------------------------------------
  VERB:
    description: "Verb error (general)"
    detection_category: MORPH

  VERB:TENSE:
    description: "Verb tense error"
    detection_category: MORPH

  VERB:ASPECT:
    description: "Verb aspect error"
    detection_category: MORPH

  VERB:FORM:
    description: "Verb form error (infinitive/participle/etc)"
    detection_category: MORPH

  VERB:NUM:
    description: "Verb number error"
    detection_category: MORPH

  VERB:GEN:
    description: "Verb gender error (past tense)"
    detection_category: MORPH

  VERB:VOICE:
    description: "Verb voice error"
    detection_category: MORPH

  VERB:MOOD:
    description: "Verb mood error"
    detection_category: MORPH

  VERB:INFL:
    description: "Verb inflection (other)"
    detection_category: MORPH

  # ---------------------------------------------------------------------------
  # OTHER POS
  # ---------------------------------------------------------------------------
  PRON:
    description: "Pronoun error"
    detection_category: OTHER

  PREP:
    description: "Preposition error"
    detection_category: OTHER

  CONJ:
    description: "Conjunction error"
    detection_category: OTHER

  DET:
    description: "Determiner error"
    detection_category: OTHER

  PART:
    description: "Particle error"
    detection_category: OTHER

  ADV:
    description: "Adverb error"
    detection_category: OTHER

  PUNCT:
    description: "Punctuation error"
    detection_category: OTHER

  # ---------------------------------------------------------------------------
  # STRUCTURAL
  # ---------------------------------------------------------------------------
  WO:
    description: "Word order error"
    detection_category: OTHER

  MORPH:
    description: "Derivational morphology"
    detection_category: MORPH

  OTHER:
    description: "Other/unclassified"
    detection_category: OTHER

# ============================================================================
# MODIFIERS (ERRANT operations)
# ============================================================================

modifiers:
  M:
    description: "Missing - token should be inserted"
    aliases: []

  U:
    description: "Unnecessary - token should be deleted"
    aliases: []

  R:
    description: "Replacement - token should be replaced"
    aliases: []

# ============================================================================
# MAPPINGS: synterr subtype -> ERRANT tag
# ============================================================================

mappings:
  # ---------------------------------------------------------------------------
  # Spelling handler subtypes
  # ---------------------------------------------------------------------------
  vowel_reduction:
    primary: SPELL
    modifier: R

  devoicing:
    primary: SPELL
    modifier: R

  tsa_confusion:
    primary: SPELL
    modifier: R

  cluster:
    primary: SPELL
    modifier: R

  double_consonant:
    primary: SPELL
    modifier: R

  soft_sign:
    primary: SPELL
    modifier: R

  keyboard:
    primary: SPELL
    modifier: R

  # ---------------------------------------------------------------------------
  # Morphological handler subtypes
  # ---------------------------------------------------------------------------
  noun_case:
    primary: NOUN:CASE
    modifier: R

  # noun_case arc-aware subtypes — ERRANT has no finer distinction
  noun_case_governed:
    primary: NOUN:CASE
    modifier: R

  noun_case_subject:
    primary: NOUN:CASE
    modifier: R

  noun_case_other:
    primary: NOUN:CASE
    modifier: R

  noun_number:
    primary: NOUN:NUM
    modifier: R

  adj_case:
    primary: ADJ:CASE
    modifier: R

  adj_number:
    primary: ADJ:NUM
    modifier: R

  adj_gender:
    primary: ADJ:GEN
    modifier: R

  verb_person_number:
    primary: VERB:NUM
    modifier: R

  verb_tense:
    primary: VERB:TENSE
    modifier: R

  paronym:
    primary: OTHER
    modifier: R

  preposition:
    primary: PREP
    modifier: R

  conjunction:
    primary: CONJ
    modifier: R

  word_omission:
    primary: OTHER
    modifier: M

  word_insertion:
    primary: OTHER
    modifier: U

  # Punctuation
  comma_subordinate:
    primary: PUNCT
    modifier: U
  comma_compound:
    primary: PUNCT
    modifier: U
  comma_parenthetical:
    primary: PUNCT
    modifier: U
  comma_isolation:
    primary: PUNCT
    modifier: U
  comma_homogeneous:
    primary: PUNCT
    modifier: U
  pair_participle:
    primary: PUNCT
    modifier: U
  pair_relative:
    primary: PUNCT
    modifier: U
  pair_gerund:
    primary: PUNCT
    modifier: U
  pair_parenthetical:
    primary: PUNCT
    modifier: U
  pair_apposition:
    primary: PUNCT
    modifier: U
  dash_subj_pred:
    primary: PUNCT
    modifier: U
  dash_other:
    primary: PUNCT
    modifier: U

  # ---------------------------------------------------------------------------
  # French PoC handler subtypes (docs/research/FRENCH_POC_WORKFLOW.md,
  # docs/research/FRENCH_POC_REPORT.md). errant.yaml is language-agnostic by
  # design (FRENCH_DESIGN.md §6), so these subtypes share the same
  # primary_tags/modifiers vocabulary as the Russian mappings above rather
  # than getting a separate French schema file.
  # ---------------------------------------------------------------------------

  # grammatical_homophone: bidirectional token swap between two homophonous
  # function words (a/à, et/est, ce/se, on/ont, son/sont) — a pure spelling
  # confusion, same category as the Russian tsa_confusion/vowel_reduction pairs.
  a_à:
    primary: SPELL
    modifier: R
  et_est:
    primary: SPELL
    modifier: R
  ce_se:
    primary: SPELL
    modifier: R
  on_ont:
    primary: SPELL
    modifier: R
  son_sont:
    primary: SPELL
    modifier: R

  # verb_ending_homophony: ending-swap on homophonous 1st-group (-er) verb
  # forms (infinitive/participle/future-conditional). Tagged VERB:FORM (not
  # SPELL) in this cross-linguistic schema: what changed is the verb's form
  # slot, even though the handler's own `category` is SPELL per Catach's
  # logogrammique framing (see errors/verb_endings.py docstring) — the two
  # taxonomies are allowed to diverge, same as Russian's noun_case_governed
  # sharing NOUN:CASE with noun_case_subject/other despite finer synterr
  # subtypes.
  inf_to_participle:
    primary: VERB:FORM
    modifier: R
  participle_to_inf:
    primary: VERB:FORM
    modifier: R
  fut_cond_1sg:
    primary: VERB:FORM
    modifier: R

  # article_contraction: de-contracts a categorical préposition+article
  # fusion (au/aux/du) back into its two separate words. Tagged DET+Missing:
  # the corrupted form is missing the contraction (a required single-word
  # determiner fusion is spelled out as two words instead).
  au_split:
    primary: DET
    modifier: M
  aux_split:
    primary: DET
    modifier: M
  du_split:
    primary: DET
    modifier: M

  # elision_apostrophe: elision_omit restores the un-elided full form of a
  # clitic/article/conjunction (in-place replace, same shape as the
  # grammatical-homophone swaps); euphonic_t_drop deletes the euphonic -t-
  # particle token between a vowel-final verb and an inverted subject
  # pronoun, so the fix reinserts it (Missing), the same modifier
  # word_omission uses for a deleted content word.
  elision_omit:
    primary: SPELL
    modifier: R
  euphonic_t_drop:
    primary: PART
    modifier: M

  # pp_agreement: strips past-participle gender/number agreement marking
  # (être-subject agreement, avoir-anteposed-object agreement). VERB:GEN is
  # the existing tag purpose-built for "verb gender error (past tense)" —
  # past participle agreement is exactly that class, extended here to also
  # cover the number half of the same agreement rule.
  etre_strip:
    primary: VERB:GEN
    modifier: R
  avoir_cod_ante_strip:
    primary: VERB:GEN
    modifier: R

# ============================================================================
# REFERENCE: Tag frequency in RULEC-GEC (approximate)
# ============================================================================

reference_frequencies:
  R:SPELL: 220
  R:NOUN:CASE: 150
  R:OTHER: 140
  R:VERB:TENSE: 80
  R:ADJ:CASE: 60
  R:PREP: 50
  R:NOUN:NUM: 40
  R:VERB:ASPECT: 35
  R:ADJ:NUM: 30
  R:ADJ:GEN: 25
  M:PREP: 60
  M:OTHER: 50
  U:OTHER: 40
