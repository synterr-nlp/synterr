# Rozental-grounded hierarchical error classification schema
# Based on: Розенталь Д. Э. Справочник по правописанию и стилистике (ИК «Комплект», 1997)
#
# Three levels:
#   L0  Detection      8 tags   (7 error categories + CORRECT)
#   L1  Working       29 tags   → synterr handlers, training analysis, paper tables
#   L2  Fine-grained  98 tags   → research annotation, Rozental § tracing
#
# L0 prefix mapping (deterministic from tag name):
#   sp_ → SPELL    mo_ → MORPH    ag_ → AGR    gv_ → GOV
#   pu_ → PUNCT    sy_ → SYNT     lx_ → LEX

name: rozental
version: "1.0"
description: "Rozental-grounded hierarchical error schema (8 L0 / 29 L1 / 98 L2)"

# =============================================================================
# L0: Detection Categories (linguistically grounded, decoupled from GECToR)
#
# GECToR d_tags.txt conversion:
#   SPELL → SPELL | MORPH, AGR, GOV → MORPH | PUNCT → PUNCT | SYNT, LEX → OTHER
# =============================================================================

detection_categories:
  CORRECT: "No error"
  SPELL: "Orthographic (Rozental Part I, §1–74)"
  MORPH: "Morphological form (Part III, §144–175)"
  AGR: "Agreement (Part III, §183–197)"
  GOV: "Government (Part III, §198–205)"
  PUNCT: "Punctuation (Part II, §75–138)"
  SYNT: "Syntax and sentence structure (Part III, §176–182, §206–213)"
  LEX: "Lexical choice + structural (Part III, §139–143)"

# =============================================================================
# L1: Working Tags (29)
#
# Prefixes = L0 categories:
#   sp_  SPELL   spelling          (Part I)
#   mo_  MORPH   morphological form (Part III, §144–175)
#   ag_  AGR     agreement         (Part III, §183–197)
#   gv_  GOV     government        (Part III, §198–205)
#   sy_  SYNT    syntax            (Part III, §176–182, §206–213)
#   pu_  PUNCT   punctuation       (Part II)
#   lx_  LEX     lexical           (Part III, §139–143 + cross-cutting)
# =============================================================================

primary_tags:
  # ---------------------------------------------------------------------------
  # SPELL (7 tags)
  # ---------------------------------------------------------------------------
  sp_root:
    description: "Root vowel/consonant spelling"
    detection_category: SPELL
    rozental_paras: "§1–10"
    rozental_chapters: "I–II"

  sp_capitalization:
    description: "Capitalization rules"
    detection_category: SPELL
    rozental_paras: "§11–28"
    rozental_chapters: "III"

  sp_affix:
    description: "Prefixes and ъ/ь signs"
    detection_category: SPELL
    rozental_paras: "§29–34"
    rozental_chapters: "IV–V"

  sp_pos:
    description: "POS-specific spelling rules (endings, suffixes, solid/hyphen/separate)"
    detection_category: SPELL
    rozental_paras: "§35–40, §45–58"
    rozental_chapters: "VI–VIII, X–XIV"

  sp_compounds:
    description: "Compound words (solid/hyphen/separate)"
    detection_category: SPELL
    rozental_paras: "§41–44"
    rozental_chapters: "IX"

  sp_function:
    description: "не/ни, conjunction/particle spelling"
    detection_category: SPELL
    rozental_paras: "§59–72"
    rozental_chapters: "XV–XVII"

  sp_foreign:
    description: "Foreign words, interjections"
    detection_category: SPELL
    rozental_paras: "§73–74"
    rozental_chapters: "XVIII–XIX"

  # ---------------------------------------------------------------------------
  # MORPH (10 tags)
  # ---------------------------------------------------------------------------
  mo_noun_case:
    description: "Noun case form variation (gen -а/-у, prep -е/-у)"
    detection_category: MORPH
    rozental_paras: "§150–155"
    rozental_chapters: "XXXVI"

  mo_noun_number:
    description: "Noun plural formation (nom -ы/-а, gen pl) + suffix variants"
    detection_category: MORPH
    rozental_paras: "§153–158"
    rozental_chapters: "XXXVI"

  mo_noun_gender:
    description: "Noun gender fluctuation, common-gender"
    detection_category: MORPH
    rozental_paras: "§144–149"
    rozental_chapters: "XXXVI"

  mo_adj_form:
    description: "Adj short/full, comparative, possessive"
    detection_category: MORPH
    rozental_paras: "§159–163"
    rozental_chapters: "XXXVII"

  mo_numeral:
    description: "Numeral declension + collective"
    detection_category: MORPH
    rozental_paras: "§164–166"
    rozental_chapters: "XXXVIII"

  mo_pronoun:
    description: "Pronoun usage (свой/его, себя)"
    detection_category: MORPH
    rozental_paras: "§167–170"
    rozental_chapters: "XXXIX"

  mo_verb_aspect:
    description: "Verb aspect pair choice"
    detection_category: MORPH
    rozental_paras: "§172"
    rozental_chapters: "XL"

  mo_verb_form:
    description: "Verb personal forms, reflexivity, participle/gerund"
    detection_category: MORPH
    rozental_paras: "§171, §173–175"
    rozental_chapters: "XL"

  mo_verb_tense:
    description: "Verb tense errors"
    detection_category: MORPH
    rozental_paras: "§172"
    rozental_chapters: "XL"

  mo_verb_person_num:
    description: "Verb person/number inflection (standalone, not agreement)"
    detection_category: MORPH
    rozental_paras: "§171"
    rozental_chapters: "XL"

  # ---------------------------------------------------------------------------
  # AGR (2 tags)
  # ---------------------------------------------------------------------------
  ag_subject_verb:
    description: "Subject-verb agreement (collective nouns, counting, coordinated)"
    detection_category: AGR
    rozental_paras: "§183–190"
    rozental_chapters: "XLIII"

  ag_modifier_noun:
    description: "Modifier-noun agreement (adj/participle/apposition)"
    detection_category: AGR
    rozental_paras: "§191–197"
    rozental_chapters: "XLIV"

  # ---------------------------------------------------------------------------
  # GOV (1 tag)
  # ---------------------------------------------------------------------------
  gv_government:
    description: "Case government, preposition choice, negation genitive"
    detection_category: GOV
    rozental_paras: "§198–205"
    rozental_chapters: "XLV"

  # ---------------------------------------------------------------------------
  # SYNTAX (2 tags)
  # ---------------------------------------------------------------------------
  sy_word_order:
    description: "Word order errors"
    detection_category: SYNT
    rozental_paras: "§178–182"
    rozental_chapters: "XLII"

  sy_construction:
    description: "Sentence structure, parallel constructions"
    detection_category: SYNT
    rozental_paras: "§176–177, §206–213"
    rozental_chapters: "XLI, XLVI–XLVIII"

  # ---------------------------------------------------------------------------
  # PUNCT (5 tags)
  # ---------------------------------------------------------------------------
  pu_comma:
    description: "Comma rules (homogeneous, isolated, parenthetical)"
    detection_category: PUNCT
    rozental_paras: "§83–103"
    rozental_chapters: "XXII–XXVI"

  pu_dash:
    description: "Dash rules"
    detection_category: PUNCT
    rozental_paras: "§79–82"
    rozental_chapters: "XXI"

  pu_clause:
    description: "Compound/complex sentence punctuation"
    detection_category: PUNCT
    rozental_paras: "§104–118"
    rozental_chapters: "XXVII–XXX"

  pu_speech_quotes:
    description: "Direct speech, citations, quotes"
    detection_category: PUNCT
    rozental_paras: "§119–132"
    rozental_chapters: "XXXI–XXXIII"

  pu_other:
    description: "Sentence-final + combinations"
    detection_category: PUNCT
    rozental_paras: "§75–78, §133–138"
    rozental_chapters: "XX, XXXIV"

  # ---------------------------------------------------------------------------
  # LEXICAL (2 tags)
  # ---------------------------------------------------------------------------
  lx_word_choice:
    description: "Paronyms, pleonasms, clichés"
    detection_category: LEX
    rozental_paras: "§139–143"
    rozental_chapters: "XXXV"

  lx_structural:
    description: "Missing/extra words, constructional errors"
    detection_category: LEX
    rozental_paras: ""
    rozental_chapters: ""

# =============================================================================
