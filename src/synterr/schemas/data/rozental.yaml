# =============================================================================
# MODIFIERS (compositional, same approach as RLC)
# =============================================================================

modifiers:
  Miss:
    description: "Missing element (needs insertion)"
    aliases: [Del]

  Extra:
    description: "Extra element (needs deletion)"
    aliases: [Ins]

# =============================================================================
# MAPPINGS: handler subtype → L1 tag
# =============================================================================

mappings:
  # Spelling handler subtypes
  vowel_reduction:
    primary: sp_root
    l2_tag: sp_root_checked
  devoicing:
    primary: sp_root
    l2_tag: sp_root_voiced_voiceless
  tsa_confusion:
    primary: sp_pos
    l2_tag: sp_verb_endings
  cluster:
    primary: sp_root
    l2_tag: sp_root_silent
  double_consonant:
    primary: sp_root
    l2_tag: sp_root_double
  # keyboard typos are deliberately UNMAPPED in rozental — they are not a
  # prescriptive-grammar phenomenon. Do NOT re-add a tag to satisfy coverage
  # tooling. (RLC maps it to Misspell, which is the correct home.)
  soft_sign:
    primary: sp_affix
    l2_tag: sp_affix_hard_soft_sign
  prefix_voicing:
    primary: sp_affix
    l2_tag: sp_affix_prefix

  # Morphological handler subtypes — nouns
  # plain noun_case kept for backward compatibility with pre-split data
  noun_case:
    primary: mo_noun_case
    l2_tag: mo_noun_case_other
  # noun_case arc-aware subtypes: governed slots are Rozental's government
  # chapter (§200 case selection by the governing word); subject-case errors
  # have no Rozental § (L2-only phenomenon) so noun_case_subject maps
  # primary-only; the residual class mirrors the pre-split mapping.
  noun_case_governed:
    primary: gv_government
    l2_tag: gv_case_choice
  noun_case_subject:
    primary: mo_noun_case
  noun_case_other:
    primary: mo_noun_case
    l2_tag: mo_noun_case_other
  noun_case_prep_e_u:
    primary: mo_noun_case
    l2_tag: mo_noun_case_prep_e_u
  noun_number:
    primary: mo_noun_number
    l2_tag: mo_noun_num_nom_pl
  # reserved: no NounGender handler yet (mapping kept for planned handler)
  # noun_gender handler never implemented — mapping reserved (§144–149);
  # see MEDIUM_WAVE_SPEC.md capsules mo_noun_gender_common / _profession
  # noun_gender:
  #   primary: mo_noun_gender
  #   l2_tag: mo_noun_gender_fluctuation

  # Morphological handler subtypes — adjectives (RECLASSIFIED as agreement)
  adj_case:
    primary: ag_modifier_noun
    l2_tag: ag_mn_agreement
  adj_number:
    primary: ag_modifier_noun
    l2_tag: ag_mn_agreement
  adj_gender:
    primary: ag_modifier_noun
    l2_tag: ag_mn_agreement
  # Adjective form (short/full, comparative) — true morphological form errors
  adj_short_full:
    primary: mo_adj_form
    l2_tag: mo_adj_short_full
  adj_double_comparative:
    primary: mo_adj_form
    l2_tag: mo_adj_comparative

  # Morphological handler subtypes — verbs
  verb_person_number:
    primary: ag_subject_verb
    l2_tag: ag_sv_agreement
  verb_tense:
    primary: mo_verb_tense
  # reserved: no VerbAspect handler yet (mapping kept for planned handler)
  # verb_aspect (§172 pair choice) never implemented — needs aspect-pair
  # lexicon; the covered §172.2 subcase is verb_iterative_suffix
  # verb_aspect:
  #   primary: mo_verb_aspect
  #   l2_tag: mo_verb_asp_pair

  # Lexical/structural handler subtypes
  paronym:
    primary: lx_word_choice
    l2_tag: lx_paronym
  preposition:
    primary: gv_government
    l2_tag: gv_prep_choice
  conjunction:
    primary: sy_construction
  pronoun_svoy:
    primary: mo_pronoun
    l2_tag: mo_pronoun_svoy
  pronoun_sebya:
    primary: mo_pronoun
    l2_tag: mo_pronoun_sebya
  pronoun_n_form:
    primary: mo_pronoun
    l2_tag: mo_pronoun_forms
  ag_mn_apposition:
    primary: ag_modifier_noun
    l2_tag: ag_mn_apposition
  ag_mn_compound_term:
    primary: ag_modifier_noun
    l2_tag: ag_mn_compound_term
  ag_mn_special:
    primary: ag_modifier_noun
    l2_tag: ag_mn_special
  agr_sv_collective:
    primary: ag_subject_verb
    l2_tag: ag_sv_collective
  agr_sv_counting:
    primary: ag_subject_verb
    l2_tag: ag_sv_counting
  agr_sv_approximate:
    primary: ag_subject_verb
    l2_tag: ag_sv_approximate
  agr_sv_compound:
    primary: ag_subject_verb
    l2_tag: ag_sv_compound
  agr_sv_coordinated:
    primary: ag_subject_verb
    l2_tag: ag_sv_coordinated
  verb_iterative_suffix:
    primary: mo_verb_aspect
    l2_tag: mo_verb_asp_iterative
  adj_possessive_form:
    primary: mo_adj_form
    l2_tag: mo_adj_possessive
  adj_short_en_enen:
    primary: mo_adj_form
    l2_tag: mo_adj_other
  noun_case_gen_partitive:
    primary: mo_noun_case
    l2_tag: mo_noun_case_gen_a_u
  noun_case_instr_pl:
    primary: mo_noun_case
    l2_tag: mo_noun_case_instr
  noun_number_gen_pl:
    primary: mo_noun_number
    l2_tag: mo_noun_num_gen_pl
  neg_genitive:
    primary: gv_government
    l2_tag: gv_neg_genitive
  root_vowel_after_sibilant:
    primary: sp_root
    l2_tag: sp_root_vowel_after
  adj_ending_vowel:
    primary: sp_pos
    l2_tag: sp_adj_endings
  root_alternating:
    primary: sp_root
    l2_tag: sp_root_alternating
  root_unchecked:
    primary: sp_root
    l2_tag: sp_root_unchecked
  word_insertion:
    primary: lx_structural
    modifier: Extra
    l2_tag: lx_word_extra
  word_omission:
    primary: lx_structural
    modifier: Miss
    l2_tag: lx_word_missing

  # Orthographic spelling handler subtypes
  pre_pri:
    primary: sp_affix
    l2_tag: sp_affix_prefix
  y_i_after_prefix:
    primary: sp_affix
    l2_tag: sp_affix_prefix
  suffix_enk_onk:
    primary: sp_pos
    l2_tag: sp_noun_endings
  suffix_insk_ensk:
    primary: sp_pos
    l2_tag: sp_adj_suffixes
  suffix_its_ets:
    primary: sp_pos
    l2_tag: sp_noun_endings
  suffix_ek_ik:
    primary: sp_pos
    l2_tag: sp_noun_endings
  participle_suffix:
    primary: sp_pos
    l2_tag: sp_participle_endings
  vowel_after_ts:
    primary: sp_pos
    l2_tag: sp_pos_sibilant
  vowel_after_sibilant:
    primary: sp_pos
    l2_tag: sp_pos_sibilant
  nn_suffix:
    primary: sp_pos
    l2_tag: sp_adj_suffixes

  # Function spelling handler subtypes
  ne_attachment:
    primary: sp_function
    l2_tag: sp_ne_ni
  ne_detachment:
    primary: sp_function
    l2_tag: sp_ne_ni
  conjunction_split:
    primary: sp_function
    l2_tag: sp_conjunction_spelling
  conjunction_merge:
    primary: sp_function
    l2_tag: sp_conjunction_spelling
  taki_hyphen:
    primary: sp_function
    l2_tag: sp_particle_spelling
  # не/ни in negative pronouns (§47) — parent is sp_pos, not sp_function
  neg_pronoun_ne_ni:
    primary: sp_pos
    l2_tag: sp_pronoun_spelling

  # Punctuation handler subtypes — commas
  comma_subordinate:
    primary: pu_clause
    l2_tag: pu_clause_subordinate
  comma_compound:
    primary: pu_clause
    l2_tag: pu_clause_compound
  comma_parenthetical:
    primary: pu_comma
    l2_tag: pu_comma_parenthetical
  comma_isolation:
    primary: pu_comma
    l2_tag: pu_comma_isolation
  comma_homogeneous:
    primary: pu_comma
    l2_tag: pu_comma_homogeneous
  comma_interjection:
    primary: pu_comma
    l2_tag: pu_comma_parenthetical
  comma_response:
    primary: pu_comma
    l2_tag: pu_comma_parenthetical
  comma_repeated:
    primary: pu_comma
    l2_tag: pu_comma_repeated
  # §116 запятая в бессоюзном сложном предложении — same L2 tag as the
  # asyndetic dash (pu_clause_asyndetic, §116–118)
  comma_asyndetic:
    primary: pu_clause
    l2_tag: pu_clause_asyndetic
  # §101 обращения — falls inside pu_comma_parenthetical's §99–103 range,
  # same precedent as comma_interjection (§102) / comma_response (§103)
  comma_vocative:
    primary: pu_comma
    l2_tag: pu_comma_parenthetical

  # Punctuation handler subtypes — comma pairs (both commas deleted)
  pair_participle:
    primary: pu_comma
    l2_tag: pu_comma_isolation
  pair_relative:
    primary: pu_clause
    l2_tag: pu_clause_subordinate
  pair_gerund:
    primary: pu_comma
    l2_tag: pu_comma_isolation
  pair_parenthetical:
    primary: pu_comma
    l2_tag: pu_comma_parenthetical
  pair_apposition:
    primary: pu_comma
    l2_tag: pu_comma_clarifying

  # Comma insert handler subtypes (extra commas)
  comma_before_kak:
    primary: pu_clause
    modifier: Extra
    l2_tag: pu_clause_comparative
  comma_in_set_phrase:
    primary: pu_comma
    modifier: Extra
    l2_tag: pu_comma_parenthetical
  comma_between_conjunctions:
    primary: pu_other
    modifier: Extra
    l2_tag: pu_combinations
  comma_in_indivisible:
    primary: pu_clause
    modifier: Extra
    l2_tag: pu_clause_indivisible

  # Punctuation handler subtypes — dashes
  dash_subj_pred:
    primary: pu_dash
    l2_tag: pu_dash_subj_pred
  dash_other:
    primary: pu_dash
    l2_tag: pu_dash_other
  dash_asyndetic:
    primary: pu_clause
    l2_tag: pu_clause_asyndetic
  dash_apposition:
    primary: pu_dash
    l2_tag: pu_dash_apposition
  dash_ellipsis:
    primary: pu_dash
    l2_tag: pu_dash_ellipsis
  dash_to_comma_apposition:
    primary: pu_dash
    l2_tag: pu_dash_apposition

  # comma_insert clause-junction (covers §104 exceptions + §109 clausal homogeneous)
  comma_clause_junction:
    primary: pu_clause
    modifier: Extra
    l2_tag: pu_clause_compound

  # Bidirectional comma_insert subtypes (GREEN tier, BIDIRECTIONAL_COMMA_DESIGN.md)
  # §86 п.1: extra comma before a single и/да/или/либо between homogeneous members
  comma_homogeneous_conj:
    primary: pu_comma
    modifier: Extra
    l2_tag: pu_comma_homogeneous
  # No § licenses a comma at the subject–predicate junction (§79 is dash-or-nothing
  # territory) — primary-only, no fine-grained child fits
  comma_subj_pred:
    primary: pu_comma
    modifier: Extra
  # §99 п.2 Прим.: bracketing words from the closed never-вводные list
  comma_pseudo_parenthetical:
    primary: pu_comma
    modifier: Extra
    l2_tag: pu_comma_parenthetical
  # §99 п.7: sentence-initial однако = союз «но», takes no comma
  comma_after_odnako:
    primary: pu_comma
    modifier: Extra
    l2_tag: pu_comma_parenthetical
  # §108 Прим.: comma inside non-splittable compound conjunctions (в то время как)
  comma_compound_conj_split:
    primary: pu_clause
    modifier: Extra
    l2_tag: pu_clause_subordinate
  # §90 п.4: comma inside «X не X» / «X так X» repetition constructions
  comma_x_ne_x:
    primary: pu_comma
    modifier: Extra
    l2_tag: pu_comma_repeated

  # Compound spelling handler subtypes
  num_dash:
    primary: sp_compounds
    l2_tag: sp_compound_hyphen
  pol_spelling:
    primary: sp_compounds
    l2_tag: sp_compound_hyphen
  compound_adj:
    primary: sp_compounds
    l2_tag: sp_compound_adj

  # Semantic handler subtypes
  pleonasm:
    primary: lx_word_choice
    l2_tag: lx_pleonasm
  collocation:
    primary: lx_word_choice
    l2_tag: lx_cliche

  # Adverb spelling handler subtypes
  adverb_solid_to_separate:
    primary: sp_pos
    l2_tag: sp_adverb_spelling
  adverb_separate_to_solid:
    primary: sp_pos
    l2_tag: sp_adverb_spelling
  adverb_hyphen_to_separate:
    primary: sp_pos
    l2_tag: sp_adverb_spelling
  adverb_separate_to_hyphen:
    primary: sp_pos
    l2_tag: sp_adverb_spelling

  # Numeral handler subtypes
  numeral_poltora:
    primary: mo_numeral
    l2_tag: mo_numeral_cardinal
  numeral_declension:
    primary: mo_numeral
    l2_tag: mo_numeral_cardinal

