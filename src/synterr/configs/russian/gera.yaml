# GERA derived error distribution
# Source: 6,681 sentences, 5,988 errors from Russian school texts
# Analysis: synterr analyze-distribution on GERA.{train,dev,test}.m2

name: gera
description: "GERA corpus distribution (Russian school texts)"
source: "GERA (Sorokin et al., 2016)"

# Pipeline settings
error_probability: 0.7
max_errors_per_sentence: 3

# Error weights (normalized to implemented handlers)
# Note: GERA is heavily skewed toward punctuation (42.5%); comma_delete + dash_delete cover ~36%
weights:
  # Spelling: 20.3% in corpus (S:ORTH + S:TYPO + S:LETTER:CASE)
  spelling: 0.712

  # Morphological - Nouns: 6.0% total
  noun_case: 0.173      # G:NOUN:CASE 5.1%
  noun_number: 0.031    # G:NOUN:NUM 0.9%

  # Morphological - Adjectives: 2.8% total
  adj_case: 0.055       # G:ADJ:CASE 1.6%
  adj_number: 0.020     # G:ADJ:NUM 0.6%
  adj_gender: 0.000     # Not annotated separately

  # Morphological - Verbs: 2.8% total
  verb_person_number: 0.000  # Combined in G:VERB:P/N/G
  verb_tense: 0.009          # G:VERB:TENSE 0.7%

  # Lexical
  paronym: 0.038             # L:OTHER 3.8%
  preposition: 0.009         # G:PREP:WRONG 0.9%
  conjunction: 0.003         # G:CONJ:WRONG 0.3%

  # Punctuation: 42.5% in GERA — dominant error type in school texts
  comma_delete: 0.220        # P:COMMA single ~22%
  comma_pair_delete: 0.140   # P:COMMA pair ~14%
  dash_delete: 0.040         # P:DASH ~4%

  # Structural
  word_omission: 0.032       # LACK 3.2%
  word_insertion: 0.000      # EXCESS 0%

# Empirical confusion matrices from RLC annotations (N=2,760 case, 917 gender, 942 number)
# Source: docs/research/confusion_matrices.json
confusion_matrices:
  case:
    Nom: {Gen: 0.52, Loc: 0.16, Ins: 0.14, Acc: 0.09, Dat: 0.08}
    Acc: {Nom: 0.34, Gen: 0.32, Dat: 0.14, Loc: 0.14, Ins: 0.05}
    Gen: {Nom: 0.53, Acc: 0.22, Loc: 0.12, Ins: 0.07, Dat: 0.06}
    Dat: {Nom: 0.35, Gen: 0.27, Acc: 0.22, Loc: 0.09, Ins: 0.08}
    Ins: {Nom: 0.43, Gen: 0.26, Acc: 0.15, Dat: 0.08, Loc: 0.08}
    Loc: {Nom: 0.37, Gen: 0.31, Acc: 0.17, Ins: 0.08, Dat: 0.06}
  gender:
    Masc: {Fem: 0.62, Neut: 0.38}
    Fem: {Masc: 0.68, Neut: 0.32}
    Neut: {Masc: 0.42, Fem: 0.58}
  number:
    Sing: {Plur: 1.0}
    Plur: {Sing: 1.0}

# Major unimplemented types in GERA:
#
# punctuation (remaining): ~6.5% - colon, semicolon, quotes, etc.
# lexical: 11.4%       - L:REP, L:OTHER, L:CONSTR
# insert: 3.4%         - LACK
