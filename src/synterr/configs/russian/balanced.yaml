# Balanced error distribution for general use
# Hand-tuned to provide diverse error coverage

name: balanced
description: "Balanced distribution for general synthetic data generation"
source: "Hand-tuned based on corpus analysis"

# Pipeline settings
error_probability: 0.7
max_errors_per_sentence: 3

# Error weights - balanced across all implemented handlers
weights:
  # Spelling: ~17%
  spelling: 0.17

  # Lexical: ~17%
  paronym: 0.05
  preposition: 0.06
  conjunction: 0.06

  # Punctuation: ~8%
  comma_delete: 0.04
  comma_pair_delete: 0.03
  dash_delete: 0.01

  # Structural: ~16%
  word_omission: 0.08
  word_insertion: 0.08

  # Morphological - Nouns: ~17%
  noun_case: 0.12
  noun_number: 0.05

  # Morphological - Adjectives: ~16%
  adj_case: 0.07
  adj_number: 0.05
  adj_gender: 0.04

  # Morphological - Verbs: ~17%
  verb_person_number: 0.09
  verb_tense: 0.08

# Empirical confusion matrices from RLC annotations (N=2,760 case, 917 gender, 942 number)
# Source: docs/research/confusion_matrices.json
confusion_matrices:
  case:
    Nom: {Gen: 0.52, Loc: 0.16, Ins: 0.14, Acc: 0.09, Dat: 0.08}
    Acc: {Nom: 0.34, Gen: 0.32, Dat: 0.14, Loc: 0.14, Ins: 0.05}
    Gen: {Nom: 0.53, Acc: 0.22, Loc: 0.12, Ins: 0.07, Dat: 0.06}
    Dat: {Nom: 0.35, Gen: 0.27, Acc: 0.22, Loc: 0.09, Ins: 0.08}
    Ins: {Nom: 0.43, Gen: 0.26, Acc: 0.15, Dat: 0.08, Loc: 0.08}
    Loc: {Nom: 0.37, Gen: 0.31, Acc: 0.17, Ins: 0.08, Dat: 0.06}
  gender:
    Masc: {Fem: 0.62, Neut: 0.38}
    Fem: {Masc: 0.68, Neut: 0.32}
    Neut: {Masc: 0.42, Fem: 0.58}
  number:
    Sing: {Plur: 1.0}
    Plur: {Sing: 1.0}
