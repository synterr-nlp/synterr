# Balanced error distribution for general use
# Hand-tuned to provide diverse error coverage

name: balanced
description: "Balanced distribution for general synthetic data generation"
source: "Hand-tuned based on corpus analysis"

# Pipeline settings
error_probability: 0.7
max_errors_per_sentence: 3

# Error weights - balanced across all implemented handlers
weights:
  # Spelling: ~17%
  spelling: 0.17

  # Lexical: ~17%
  paronym: 0.05
  preposition: 0.06
  conjunction: 0.06

  # Punctuation: ~8%
  comma_delete: 0.04
  comma_pair_delete: 0.03
  comma_insert: 0.03
  dash_delete: 0.01

  # Function word spelling: ~6%
  function_spelling: 0.06

  # Orthographic spelling: ~6%
  orthographic_spelling: 0.06

  # Compound word spelling: ~3%
  compound_spelling: 0.03

  # Adverb spelling: ~3%
  adverb_spelling: 0.03

  # Semantics: ~4%
  pleonasm: 0.02
  collocation: 0.02

  # Structural: ~16%
  word_omission: 0.08
  word_insertion: 0.08

  # Morphological - Nouns: ~17%
  noun_case: 0.12
  noun_number: 0.05

  # Morphological - Adjectives: ~16%
  adj_case: 0.07
  adj_number: 0.05
  adj_gender: 0.04

  # Morphological - Verbs: ~17%
  verb_person_number: 0.09
  verb_tense: 0.08

  # Morphological - Numerals: ~1%
  numeral_declension: 0.01

# No confusion matrices: this preset is corpus-agnostic.
# Morph handlers fall back to uniform random substitution.
