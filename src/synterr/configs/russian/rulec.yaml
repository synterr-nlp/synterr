# RULEC-GEC derived error distribution
# Source: 12,480 sentences, 11,847 errors from L2/heritage learner essays
# Analysis: synterr analyze-distribution on RULEC-GEC_{dev,test,train}_M2.txt

name: rulec
description: "RULEC-GEC corpus distribution (L2/heritage learners)"
source: "RULEC-GEC (Rozovskaya & Roth, 2019)"

# Pipeline settings
error_probability: 0.7
max_errors_per_sentence: 3

# Error weights (normalized to implemented handlers)
# Full corpus distribution shown in comments
weights:
  # Spelling: 21.8% in corpus -> 47.5% of implemented
  spelling: 0.475

  # Morphological - Nouns: 15.2% total
  noun_case: 0.280      # 12.8% in corpus
  noun_case_prep: 0.005 # second locative -е/-у (subsumed in Gov; estimated)
  noun_number: 0.053    # 2.4%

  # Morphological - Adjectives: 5.4% total
  adj_case: 0.071       # 3.3%
  adj_number: 0.019     # 0.9%
  adj_gender: 0.027     # 1.2%
  adj_form: 0.005       # short/full form (RLC Brev: 0.5%)
  adj_double_comparative: 0.002  # pleonastic comparative (RLC Com: 0.2%)

  # Morphological - Verbs: 5.3% total
  verb_person_number: 0.052  # 2.4%
  verb_tense: 0.023          # 1.0%

  # Morphological - Numerals
  numeral_declension: 0.005

  # Lexical
  paronym: 0.122 # lexical: 12.2%
  preposition: 0.031 # 3.1%
  conjunction: 0.007 # 0.7%

  # Punctuation (not attested in RULEC L2 learner data)
  comma_delete: 0.0
  comma_pair_delete: 0.0
  comma_insert: 0.0
  dash_delete: 0.0
  dash_to_comma: 0.0

  # Function word spelling (not separately attested in RULEC; estimated)
  function_spelling: 0.05

  # Orthographic spelling (suffix/prefix rules)
  orthographic_spelling: 0.05

  # Compound word spelling (dashes, пол-, compound adj)
  compound_spelling: 0.02

  # Adverb spelling (solid/hyphen/separate)
  adverb_spelling: 0.02

  # Semantics
  pleonasm: 0.01
  collocation: 0.01

  # Structural
  word_omission: 0.146 # insert: 14.6%
  word_insertion: 0.082 # delete: 8.2%

# Subtype weights within handlers
# These control the distribution of error subtypes when a handler is selected.
# Values are relative weights (not probabilities) - higher = more likely.
subtype_weights:
  # noun_case classification is deterministic (dep arc decides the subtype),
  # so these act as enable gates; magnitudes document the attestation split.
  noun_case:
    noun_case_governed: 70  # Head-governed slots (obl/nmod/iobj/obj) — well-attested
    noun_case_subject: 20   # Subject case errors (RLC 'Nominative')
    noun_case_other: 10     # Appositions, conjuncts, other dep-attached nouns

  spelling:
    vowel_reduction: 30     # Unstressed vowel confusion (аканье/иканье)
    tsa_confusion: 25       # -тся/-ться confusion (most common)
    prefix_voicing: 15      # из-/ис-, раз-/рас- prefix errors
    devoicing: 10           # Word-final devoicing (город → горот)
    cluster: 10             # Consonant cluster simplification
    double_consonant: 5     # Double consonant errors
    keyboard: 3             # Keyboard typos
    soft_sign: 2            # Soft sign errors

# Empirical confusion matrices from RLC annotations (N=2,760 case, 917 gender, 942 number)
# Source: docs/research/confusion_matrices.json
confusion_matrices:
  case:
    Nom: {Gen: 0.52, Loc: 0.16, Ins: 0.14, Acc: 0.09, Dat: 0.08}
    Acc: {Nom: 0.34, Gen: 0.32, Dat: 0.14, Loc: 0.14, Ins: 0.05}
    Gen: {Nom: 0.53, Acc: 0.22, Loc: 0.12, Ins: 0.07, Dat: 0.06}
    Dat: {Nom: 0.35, Gen: 0.27, Acc: 0.22, Loc: 0.09, Ins: 0.08}
    Ins: {Nom: 0.43, Gen: 0.26, Acc: 0.15, Dat: 0.08, Loc: 0.08}
    Loc: {Nom: 0.37, Gen: 0.31, Acc: 0.17, Ins: 0.08, Dat: 0.06}
  gender:
    Masc: {Fem: 0.62, Neut: 0.38}
    Fem: {Masc: 0.68, Neut: 0.32}
    Neut: {Masc: 0.42, Fem: 0.58}
  number:
    Sing: {Plur: 1.0}
    Plur: {Sing: 1.0}

# Unimplemented error types (for reference)
# These are significant in RULEC-GEC but not yet in synterr:
#
# lexical: 12.2%       - Word choice errors
# preposition: 3.1%    - Preposition errors
# verb_aspect: 1.8%    - Aspect confusion
# verb_voice: 1.1%     - Voice errors (add/remove -ся)
# pronoun: 0.9%        - Pronoun errors
# conjunction: 0.7%    - Conjunction errors
