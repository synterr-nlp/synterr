# Profile: spelling-only (cheapest tier)
# No depparse needed, no pymorphy inflection
# Tests: string manipulation, regex matching, morpheme dict lookup

name: profile_spelling
description: "Profiling preset: spelling handlers only (no depparse, no inflection)"
source: "Profiling"

error_probability: 1.0
max_errors_per_sentence: 1

weights:
  spelling: 0.30
  function_spelling: 0.20
  orthographic_spelling: 0.20
  compound_spelling: 0.10
  adverb_spelling: 0.10
  pleonasm: 0.05
  collocation: 0.05

  # Zero out everything else
  noun_case: 0.0
  noun_number: 0.0
  adj_case: 0.0
  adj_number: 0.0
  adj_gender: 0.0
  verb_person_number: 0.0
  verb_tense: 0.0
  numeral_declension: 0.0
  paronym: 0.0
  preposition: 0.0
  conjunction: 0.0
  comma_delete: 0.0
  comma_pair_delete: 0.0
  comma_insert: 0.0
  dash_delete: 0.0
  word_omission: 0.0
  word_insertion: 0.0
