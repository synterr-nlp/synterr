site_name: synterr
site_description: Reproducible synthetic error generation for Grammatical Error Correction
site_url: https://synterr-nlp.github.io/synterr/
repo_url: https://github.com/synterr-nlp/synterr
repo_name: synterr-nlp/synterr
edit_uri: edit/master/docs/site/

docs_dir: docs/site

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
  - attr_list
  - md_in_html

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Architecture: architecture.md
  - Error types: error-types.md
  - Reproducibility: reproducibility.md
  - Roadmap: roadmap.md
  - Contributing: contributing.md
