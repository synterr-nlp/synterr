[project]
name = "synterr"
version = "1.0.0"
description = "Reproducible error generation for Grammatical Error Correction"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Anna Smirnova", email = "anna.smirnova@unil.ch" }
]
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Default Russian backend (stanza - best accuracy)
russian = [
    "stanza>=1.7",
    "pymorphy3>=2.0",
    "razdel>=0.5",
]
# Alternative backends
natasha = [
    "natasha>=1.6",
    "pymorphy3>=2.0",
]
spacy = [
    "spacy>=3.7",
    "pymorphy3>=2.0",
]
# Development dependencies
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]
# Data generation scripts
gen = [
    "sacremoses>=0.0.52",
    "openpyxl>=3.1.5",
]
# All backends + dev
all = [
    "synterr[russian,natasha,spacy,dev]",
]

[project.scripts]
synterr = "synterr.cli:main"

[project.entry-points."synterr.languages"]
russian = "synterr.languages.russian:RussianLanguage"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/synterr"]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",   # line-too-long: formatter handles wrapping
    "RUF001", # ambiguous unicode (Cyrillic ↔ Latin) — false positives in Russian linguistic code
    "RUF002", # ditto, in docstrings
    "RUF003", # ditto, in comments
    "RUF012", # mutable class attrs need ClassVar — false positive on DEFAULT_WEIGHTS dicts
    "SIM102", # nested if — readability often better than collapsed
    "SIM103", # return condition directly — sometimes hurts readability
]

[tool.ruff.lint.isort]
known-first-party = ["synterr"]

[tool.mypy]
python_version = "3.11"
files = ["src/synterr/core", "src/synterr/schemas"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
strict_equality = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=src/synterr --cov-report=term-missing"

[tool.coverage.run]
source = ["src/synterr"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[dependency-groups]
dev = [
    "mypy>=1.20.2",
    "openpyxl>=3.1.5",
    "types-pyyaml>=6.0.12.20260408",
]
