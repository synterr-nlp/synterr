[project]
name = "synterr"
version = "0.1.1"
description = "Reproducible error generation for Grammatical Error Correction"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Anna Smirnova", email = "anna.smirnova@unil.ch" }
]
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Default Russian backend (stanza - best accuracy)
russian = [
    "stanza>=1.7",
    "pymorphy3>=2.0",
    "razdel>=0.5",
]
# Alternative backends
natasha = [
    "natasha>=1.6",
    "pymorphy3>=2.0",
]
spacy = [
    "spacy>=3.7",
    "pymorphy3>=2.0",
]
# Development dependencies
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]
# All backends + dev
all = [
    "synterr[russian,natasha,spacy,dev]",
]

[project.scripts]
synterr = "synterr.cli:main"

[project.entry-points."synterr.languages"]
russian = "synterr.languages.russian:RussianLanguage"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/synterr"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["synterr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=src/synterr --cov-report=term-missing"

[tool.coverage.run]
source = ["src/synterr"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
