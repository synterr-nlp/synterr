name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Lint, format, types (make lint — same call as local gate)
        run: make lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Cache stanza models
        uses: actions/cache@v4
        with:
          path: ~/stanza_resources
          key: stanza-ru-${{ runner.os }}-v1
      - name: Fast tests (make test — same call as local gate)
        run: make test PYTEST_ADDOPTS="--cov-report=xml"
      - name: Slow integration tests (real stanza backend)
        run: make test-slow
      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
