name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Run ruff check
        run: uv run ruff check src tests
      - name: Run ruff format check
        run: uv run ruff format --check src tests
      - name: Run mypy
        run: uv run mypy

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Cache stanza models
        uses: actions/cache@v4
        with:
          path: ~/stanza_resources
          key: stanza-ru-${{ runner.os }}-v1
      - name: Run fast tests (mocked / hand-built tokens)
        run: uv run pytest --cov-report=xml -m "not slow"
      - name: Run slow integration tests (real stanza backend)
        run: uv run pytest --no-cov -m "slow"
      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
